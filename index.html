<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rae's Library — Spicy Little Chatbots</title>
<meta name="description" content="Guides, prompt builders and platform tools for AI character creators, from SpicyChatRae.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Caprasimo&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
  50% { transform: translateY(-9px) rotate(var(--r, 0deg)); }
}
@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.85); }
  50% { opacity: .9; transform: scale(1.1); }
}

body {
  min-height: 100vh;
  background: #0e0b0a;
  font-family: 'Nunito', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px 60px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 580px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 34px 90px rgba(0,0,0,.6);
}
.card-inner {
  position: relative;
  padding: 44px 34px 40px;
  background: radial-gradient(130% 90% at 50% -8%, #3a231c 0%, #251610 48%, #160e0b 100%);
  color: #f0e7da;
  overflow: hidden;
  text-align: center;
}
.card-inner::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(240,231,218,.05) 1.3px, transparent 1.3px);
  background-size: 22px 22px;
  pointer-events: none;
}

.accent-heart { position: absolute; top: 120px; left: 24px; color: #b0242a; font-size: 16px; --r: -16deg; animation: floaty 5.5s ease-in-out infinite; opacity: .6; -webkit-text-stroke: 2px #fff; paint-order: stroke fill; pointer-events: none; }
.accent-star-1 { position: absolute; top: 60px; right: 40px; color: #8fce9c; font-size: 13px; animation: twinkle 4s ease-in-out infinite; pointer-events: none; }
.accent-star-2 { position: absolute; bottom: 150px; right: 26px; color: #c9c9cf; font-size: 11px; animation: twinkle 5.5s ease-in-out .7s infinite; pointer-events: none; }

.header { position: relative; margin-bottom: 6px; }
.header-sunburst {
  position: absolute; top: -26px; left: 50%;
  width: 260px; height: 260px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(176,36,42,.14) 0 7deg, transparent 7deg 14deg);
  opacity: .5;
  pointer-events: none;
}
.header-content { position: relative; }
.rae-love-sticker { position: absolute; top: -30px; left: -12px; width: 76px; transform: rotate(-15deg); filter: drop-shadow(0 6px 13px rgba(0,0,0,.45)); pointer-events: none; }
.title {
  font-family: 'Caprasimo', cursive;
  font-size: clamp(48px, 10vw, 62px);
  line-height: .92;
  color: #f5ede1;
  margin-top: 8px;
  padding-left: 20px;
  text-shadow: 3px 4px 0 rgba(124,26,29,.6);
}
.subtitle-pill {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 12px;
  background: #b0242a; color: #fff;
  font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px;
  padding: 3px 18px; border-radius: 22px;
  transform: rotate(1.5deg);
  box-shadow: 0 6px 16px rgba(124,26,29,.5);
}

.hero { position: relative; margin: 10px 0 4px; }
.hero img {
  display: block;
  width: 300px; max-width: 78%;
  margin: 0 auto;
  filter: drop-shadow(0 18px 26px rgba(0,0,0,.5));
}

.blurb {
  position: relative;
  max-width: 440px;
  margin: 6px auto 26px;
  font-size: 15px;
  line-height: 1.65;
  color: #c8b6a7;
}

.cta {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; max-width: 380px;
  padding: 16px 22px;
  background: #fbf3e6;
  border: 2px solid #7c1a1d;
  border-radius: 16px;
  box-shadow: 0 0 0 5px #fff, 0 12px 26px rgba(0,0,0,.4);
  text-decoration: none;
  font-family: 'Caprasimo', cursive;
  font-size: 24px;
  color: #2a1712;
  transform: rotate(-1.2deg);
  transition: transform .16s, box-shadow .16s;
}
.cta:hover { transform: rotate(0deg) scale(1.03); box-shadow: 0 0 0 5px #fff, 0 18px 36px rgba(0,0,0,.5); }
.cta-arrow {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 9px;
  background: #b0242a; color: #fff;
  font-size: 22px; line-height: 1;
  box-shadow: 0 3px 0 #7c1a1d;
}

.cta-stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.cta.alt { transform: rotate(1.1deg); border-color: #2f5a3a; }
.cta.alt .cta-arrow { background: #3f6b48; box-shadow: 0 3px 0 #244a30; }
.cta.alt:hover { transform: rotate(0deg) scale(1.03); }

.footer { position: relative; margin-top: 34px; }
.footer-text { font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px; color: #e8a0a0; }
.footer-note { margin-top: 6px; font-size: 12px; color: #9a6a55; }

@media (max-width: 480px) {
  .card-inner { padding: 38px 20px 34px; }
  .cta { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="card">
  <div class="card-inner">

    <div class="accent-heart">&#10084;</div>
    <div class="accent-star-1">&#10022;</div>
    <div class="accent-star-2">&#10022;</div>

    <div class="header">
      <div class="header-sunburst"></div>
      <div class="header-content">
        <img class="rae-love-sticker" src="assets/rae-love.png" alt="">
        <div class="title">Rae's Library</div>
        <div class="subtitle-pill">
          <span>&#10084;</span>Spicy Little Chatbots<span>&#10084;</span>
        </div>
      </div>
    </div>

    <div class="hero">
      <img src="assets/rae-teaching.png" alt="Rae teaching">
    </div>

    <p class="blurb">Guides, prompt builders and platform tools for AI character creators &mdash; everything I wish I'd had when I started.</p>

    <div class="cta-stack">
      <a class="cta" href="./library/">Enter the Library <span class="cta-arrow">&#8250;</span></a>
      <a class="cta alt" href="./links/">Where to Play <span class="cta-arrow">&#8250;</span></a>
    </div>

    <div class="footer">
      <div class="footer-text">hot girls teach hot lessons &#10084;</div>
      <div class="footer-note">18+ &middot; fictional AI characters &amp; interactive stories</div>
    </div>

  </div>
</div>

</body>
</html>
